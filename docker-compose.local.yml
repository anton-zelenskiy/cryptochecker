version: '3'

services:
  app:
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - redis
    networks:
      - custom_network
    env_file:
      - .env.dev
    volumes:
      - ./project:/home/project
    command: gunicorn -w 1 --preload -b :5001 app:app
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra-nginx/data/nginx.conf:/etc/nginx/nginx.conf
      - ./infra-nginx/data/conf:/etc/nginx/conf.d
      - ./infra-nginx/cert.pem:/etc/cert.pem
      - ./infra-nginx/private.key:/etc/private.key
    depends_on:
      - app
    networks:
      - custom_network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  redis:
    image: redis:latest
    networks:
      - custom_network
#    command: redis-server --requirepass redis_password
  worker:
    build: .
    image: app:latest
    command: celery -A project.app.celery worker -l info -Q default
    env_file:
      - .env.dev
    volumes:
      - ./project:/home/project
    links:
      - redis
    depends_on:
      - redis
    networks:
      - custom_network
  beat:
    build: .
    image: app:latest
    networks:
      - custom_network
    entrypoint: celery -A project.app.celery beat -l info
    env_file:
      - .env.dev
    volumes:
      - ./project:/home/project

networks:
  custom_network:
