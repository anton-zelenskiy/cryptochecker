version: '3'

services:
  app:
    restart: always
    build: ./project
    ports:
      - "5001:5001"
    depends_on:
      - redis
    networks:
      - custom_network
    env_file:
      - .env.dev
    volumes:
      - ./project:/home/project
    command: gunicorn -w 1 -b :5001 app:app
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra-nginx/data/nginx.conf:/etc/nginx/nginx.conf
      - ./infra-nginx/data/conf.local:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - custom_network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  redis:
    image: redis:3.2.11
    networks:
      - custom_network
    ports:
      - "6379:6379"

networks:
  custom_network:
