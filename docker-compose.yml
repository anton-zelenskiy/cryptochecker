services:
  app:
    image: ${GHCR_IMAGE:-cryptochecker:local}
    build: .
    depends_on:
      - redis
      - db
    networks:
      - cryptochecker
      - nginx-bot_reverse_proxy
    env_file:
      - .env
    command: uvicorn project.web.main:app --host 0.0.0.0 --port 8000
    restart: on-failure
  redis:
    image: redis:7
    networks:
      - cryptochecker
    restart: on-failure
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cryptochecker
    restart: on-failure
  worker:
    image: ${GHCR_IMAGE:-cryptochecker:local}
    build: .
    command: celery -A project.celery_app:celery_app worker -l warning -Q default
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - cryptochecker
    restart: on-failure
  beat:
    image: ${GHCR_IMAGE:-cryptochecker:local}
    build: .
    command: celery -A project.celery_app:celery_app beat -l warning
    env_file:
      - .env
    networks:
      - cryptochecker
    restart: on-failure

networks:
  cryptochecker:
  nginx-bot_reverse_proxy:
    external: true

volumes:
  postgres_data:
