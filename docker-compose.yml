version: '3'

services:
  app:
    restart: always
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - redis
    networks:
      - app_2
      - infra-nginx_reverse_proxy
    env_file:
      - .env.prod
    command: gunicorn -w 1 -b :5001 app:app
  redis:
    image: redis:3.2.11
    networks:
      - app_2
    command: redis-server --requirepass redis_password

networks:
  app_2:
  infra-nginx_reverse_proxy:
    external: true
