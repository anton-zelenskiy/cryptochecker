version: '3'

services:
  app:
    restart: always
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - redis
    networks:
      - app_2
      - nginx-bot_reverse_proxy
    env_file:
      - .env.prod
    volumes:
      - ./project:/home/project
    command: gunicorn -w 1 --preload -b :5001 app:app
  redis:
    image: redis:latest
    networks:
      - app_2
    command: redis-server --requirepass redis_password

networks:
  app_2:
  nginx-bot_reverse_proxy:
    external: true
